    <!-- Schema.org JSON-LD: FAQPage Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I book an appointment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can easily book online via our interactive booking form or 60-second consultation quiz, or call our clinic desk directly at (800) 555-0199."
          }
        },
        {
          "@type": "Question",
          "name": "Do you offer free consultations?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! We currently provide a New Patient Special offering a complimentary comprehensive consultation, digital smile assessment, and treatment plan discussion."
          }
        },
        {
          "@type": "Question",
          "name": "How long does a dental appointment take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A typical initial consultation and exam takes 30 to 45 minutes. Specific procedures vary depending on the customized treatment plan."
          }
        },
        {
          "@type": "Question",
          "name": "Do you treat dental emergencies?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, we reserve daily slots for urgent dental emergencies including acute tooth pain, broken crowns, chipped teeth, and infections."
          }
        },
        {
          "@type": "Question",
          "name": "Do you offer payment plans?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We provide flexible 0% interest financing options through reputable medical financing partners, making top-tier smile transformations accessible."
          }
        },
        {
          "@type": "Question",
          "name": "How much does treatment cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pricing depends on individual dental needs. We provide transparent upfront estimates with no hidden fees during your consultation."
          }
        },
        {
          "@type": "Question",
          "name": "Do you accept insurance?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We work with most major PPO dental insurance providers and our team handles all claims filing on your behalf."
          }
        },
        {
          "@type": "Question",
          "name": "What should I bring to my appointment?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Please bring a valid photo ID, your dental insurance card if applicable, and any recent dental records or X-rays you might have."
          }
        }
      ]
    }
